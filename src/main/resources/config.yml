# =========================================================================
# 13. ENCHANTABLE PET ARMOR
# =========================================================================
enchantable-pet-armor:
  enabled: true
  # Allows combining Protection, Fire, Blast, Projectile, Thorns, Unbreaking, and Mending
  # onto Wolf Armor, Horse Armor, and Nautilus Armor in an anvil.
  # (Indestructible horse armors are safeguarded against durability deletion).
  allow-cross-protection: true

# =========================================================================
# 14. ENTITY TWEAKS
# =========================================================================
entity-tweaks:
  enabled: true

  # Custom NMS pathfinding goals (Raiders, Witches, Zombies, Giants, Piglins)
  custom-mob-ai: true

  # Illusioners nerf: Replaces the 20s Blindness spell with 3s of Blindness into 10s of Darkness
  illusioner-darkness: true

  # Mobs drop XP when killed by Wither Roses, Magma blocks, Cramming, Lava, Fall damage,
  # Pointed Dripstone / Stalagmites, Stonecutters, or Iron Golems
  environmental-xp-drops: true

  # Golem & Snowman active target coordinator system (Iron Golems prioritize high threats then standard threats)
  golem-attack-system: true

  # Witches throw Splash Strong Healing at Zombies (dealing lethal inverse damage to undead)
  witch-heal-against-undead: true

  # Prevents friendly-fire damage, targeting, and projectile hits between fellow Illagers, Witches, and Skeletons
  prevent-illager-friendly-fire: true

  # Armor stands naturally spawn with arms
  armor-stands-have-arms: true

  # Iron Golems completely ignore and do not damage Zombie Villagers (allowing players to cure them)
  iron-golem-ignore-zombie-villagers: true

  # Zombies, Skeletons, Strays, Bogged, and Phantoms do not combust in daylight (and skeletons won't flee to shade)
  no-daylight-burning: true

  # Hoglins and Piglins do not zombify when in the Overworld
  no-overworld-zombification: true

  # Entities and players cannot trample Farmland crops into dirt
  prevent-crop-trample: true

  # Protects Turtle Eggs from being trampled or broken (mobs still pathfind to them, but walking on them won't crack them)
  protect-turtle-eggs: true

# =========================================================================
# 15. FAST LEAF DECAY
# =========================================================================
fast-leaf-decay:
  enabled: true
  # Delay (in ticks) after breaking a log before leaf decay starts (20 ticks = 1 second)
  break-delay-ticks: 4
  # Delay (in ticks) between cascading leaf decay ripples
  decay-delay-ticks: 2
  # Maximum leaves processed per tick (prevents lag spikes on massive 2x2 spruce/jungle trees)
  max-decay-per-tick: 20
  # Ambient leaf breaking particles
  spawn-particles: true
  # Leaf breaking sound effect
  play-sound: true
  # When true, leaves drop their natural loot (saplings, apples, sticks)
  drop-items: true
  # Enabled worlds. Use ["ALL"] for all worlds.
  worlds:
    - "ALL"

# =========================================================================
# 16. FOOD & STORAGE EXTENSION
# =========================================================================
food-and-storage:
  # Allows eating even when the hunger bar is full (Paper FoodComponent integration)
  always-eat:
    enabled: true

  # Configurable capacity of bundles (how many stacks a single bundle holds)
  bundle-capacity:
    enabled: true
    stacks: 2 # 2 stacks = 128 items capacity

  # Custom maximum stack sizes (enforced natively via 1.21 item components)
  custom-stacks:
    enabled: true
    potions: 8
    soups: 16
    cakes: 16
    totems: 4

# =========================================================================
# 17. INVENTORY TOTEM OF UNDYING
# =========================================================================
# Activates Totems of Undying from ANY inventory slot (excluding shulkers & bundles)
inventory-totem:
  enabled: true

# =========================================================================
# 18. LEAD ANY MOB
# =========================================================================
lead-any-mob:
  enabled: true
  # Allowed worlds for custom leashing and teleportation. Use ["ALL"] for all worlds.
  worlds:
    - "ALL"

# =========================================================================
# 19. MAGICAL CAMPFIRE
# =========================================================================
magical-campfire:
  enabled: true
  campfire:
    enabled: true
    require-lit: true
    amount: 1.0 # Half-heart per interval
    range: 3
    actionbar:
      enabled: true
      message: "<green>You feel the warmth healing you.</green>"
  soul-campfire:
    enabled: true
    require-lit: true
    amount: 1.5
    range: 3
    actionbar:
      enabled: true
      message: "<cyan>The soul flame restores your energy.</cyan>"

# =========================================================================
# 20. PET TELEPORTATION
# =========================================================================
pet-teleportation:
  enabled: true

  # Teleport following pets to the player when the player teleports
  teleport-on-player-teleport: true

  # Teleport following pets when the chunk they are in is about to unload
  teleport-on-chunk-unload: true

  # Teleport following pets if they get stranded too far behind the player
  distance-teleport:
    enabled: true
    # Maximum distance before following pets catch up (blocks)
    max-distance: 24.0
    # Scan interval in ticks (60 ticks = 3 seconds)
    check-interval: 60

  # Allow following pets to teleport across dimensions / worlds to follow their owner
  cross-world: true

  # Optional: Keep the origin chunk loaded for X seconds after a player teleports (0 = disabled)
  keep-chunk-loaded-seconds: 0

# =========================================================================
# 21. SHIELD COMBAT SYSTEM
# =========================================================================
shield-settings:
  enabled: true
  instant-block: true # Removes the vanilla 5-tick (0.25s) shield raise delay
  auto-patch-paper-stun: true # Ensures paper-global.yml enables skip-vanilla-damage-tick-when-shield-blocked
  axe-disable-ticks: 100 # Cooldown applied when disabled by an axe (100 ticks = 5 seconds)

# =========================================================================
# 22. SHULKER DYEING
# =========================================================================
shulker-colors:
  enabled: true
  # Allows dispensers to dye shulkers directly facing them
  dispenser-dyeing: true
  # Allows washing dyed shulkers back to their default color using a Water Bottle
  allow-wash: true
  # Play dye sound when dyed
  play-sound: true
  # Emit dye particles when applied
  spawn-particles: true

# =========================================================================
# 23. SNOW PHYSICS & SNOWBALL LAYERS
# =========================================================================
snow-physics:
  enabled: true
  # Unsupported snow layers fall like sand/gravel and stack on impact
  falling-snow-layers: true
  # Thrown snowballs create or build up snow layers when hitting blocks
  snowball-layers: true
  # When a snow layer reaches 8 layers from snowballs, convert into a full Snow Block
  convert-to-snow-block: true

# =========================================================================
# 24. SPEAR COMBAT
# =========================================================================
spear-settings:
  enabled: true
  # Matches attack speed to the lunge animation duration (12 ticks = 6-tick cooldown feel)
  lunge-fast-cooldown: true

# =========================================================================
# 25. TRIDENT COMBAT & ENCHANTMENTS
# =========================================================================
trident-settings:
  enabled: true
  reach-distance: 4.5 # Matches vanilla spear reach
  attack-speed: 1.3 # Midpoint between Sword (1.6) and Axe (1.0)
  all-weather-riptide: true # Riptide on dry land has a 5s cooldown; rain/water has 0s cooldown
  channeling-all-items: true # Melee hits with any Channeling item summon lightning
  protect-mob-drops: true # Lightning from Channeling will not destroy drops from the killed mob

  # Comprehensive inventory & retrieval management
  handling:
    # Return trident to main hand if thrown from main hand and hand is empty
    return-to-main-hand: true
    # Return trident to off-hand if thrown from off-hand and off-hand is empty
    return-to-off-hand: true
    # Triggers Loyalty return if a trident falls into the void below the world
    void-loyalty-return: true
    # Portal behavior: CANCEL (prevents disappearing) or ALLOW
    portal-behavior:
      nether-portal: CANCEL
      end-portal: CANCEL
      end-gateway: CANCEL

# =========================================================================
# 26. TURTLE SCUTE BRUSHING
# =========================================================================
turtle-brushing:
  enabled: true
  # Durability cost on the brush (16 matches vanilla Armadillo brushing)
  brush-durability-cost: 16

# =========================================================================
# 27. VILLAGER INSTANT RESTOCK
# =========================================================================
villager-restock:
  enabled: true

  # Restock trades immediately while trading (trades never lock up mid-session)
  mid-trade-restock: true

  # Restock trades when opening the trade GUI
  open-gui-restock: true

  # Also apply instant restocking to Wandering Traders
  include-wandering-traders: true

  # If true, resets trade demand to 0 so prices never inflate from frequent trading
  clear-price-inflation: false

# =========================================================================
# 28. VOID TELEPORT
# =========================================================================
void-teleport:
  enabled: true
  # The Y-level in The End that triggers the void rescue (The End void starts at Y <= 0.0)
  void-threshold-y: 0.0
  # The height in the Overworld where the player appears (X and Z coordinates are preserved)
  fall-height: 512.0
  # Target world. Use "DEFAULT_OVERWORLD" to dynamically locate the primary overworld
  target-world: "DEFAULT_OVERWORLD"
  # Grants one-time fall damage immunity when hitting the ground in the Overworld
  immune-until-landing: true
  # Also rescues and teleports the player's mount or vehicle (horses, camels, boats, etc.)
  teleport-vehicle: true
  # Resets accumulated void fall distance upon teleporting
  reset-fall-distance: true
  # Optional Slow Falling effect duration (seconds) to give players time to deploy an Elytra (0 to disable)
  slow-falling-seconds: 5
  # Sound played when entering the Overworld
  sound: "item.chorus_fruit.teleport"
  # MiniMessage notification sent to the player (supports gradients, hex colors, and tags)
  message: "<gradient:#4facfe:#00f2fe>You plunge through the cosmic void, falling into the Overworld skies!</gradient>"

# =========================================================================
# 29. WIND CHARGE & WIND BURST
# =========================================================================
wind-charge:
  enabled: true
  # Bypasses Blast Protection IV, Netherite, and Armor Trim dampening on knockback
  ignore-armor-dampening: true