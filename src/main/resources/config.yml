# =========================================================================
#                       TWEAKSKOMPASS CONFIGURATION
# =========================================================================

# =========================================================================
# 1. ANVIL OVERHAUL
# ==========================================+==============================
anvil-settings:
  enabled: true
  # Completely removes the vanilla "Too Expensive!" limit (costs of 40+ levels are allowed).
  # Handles repairs with raw materials, item renaming, and enchantment combinations.
  remove-too-expensive-limit: true

# =========================================================================
# 2. ARMOR TRIM OVERHAUL
# =========================================================================
armor-trims:
  enabled: true

  # Piglins will not attack players wearing any armor piece trimmed with Gold
  gold-trim-piglin-pacify: true

  # Status effects granted by wearing trimmed armor sets
  effects:
    enabled: true
    refresh-seconds: 5

    # Mixed Set: Awards Absorption II when wearing 4 trimmed pieces of different patterns
    mixed-trims-absorption: true
    mixed-absorption-amplifier: 1 # Amplifier 1 = Absorption II

    # Matching Set: Effects applied when all 4 pieces share the same pattern
    # Format: - "EFFECT_NAME,AMPLIFIER" (amplifier 0 = Level 1, 1 = Level 2)
    patterns:
      SENTRY:
        - "RESISTANCE,0"
      DUNE:
        - "HASTE,1"
      COAST:
        - "WATER_BREATHING,0"
      WILD:
        - "JUMP_BOOST,1"
      WARD:
        - "NIGHT_VISION,0"
      VEX:
        - "SPEED,0"
      TIDE:
        - "CONDUIT_POWER,0"
      SNOUT:
        - "FIRE_RESISTANCE,0"
      RIB:
        - "REGENERATION,0"
      EYE:
        - "HEALTH_BOOST,1"
      SPIRE:
        - "SLOW_FALLING,0"
      SILENCE:
        - "STRENGTH,0"
      WAYFINDER:
        - "NONE"
      RAISER:
        - "NONE"
      SHAPER:
        - "NONE"
      HOST:
        - "NONE"
      FLOW:
        - "NONE"
      BOLT:
        - "SATURATION,0"

  # Ambient particles emitted around players wearing full matching sets
  particles:
    enabled: true
    count: 3

# =========================================================================
# 3. ARROW SETTINGS
# =========================================================================
arrow-settings:
  enabled: true

  # Friendly-fire collision pass-through toggles
  skeleton-passthrough: true # Arrows shot by skeletons pass through fellow skeletons (including Strays & Bogged)
  illager-passthrough: true # Arrows shot by pillagers & illusioners pass through all fellow raiders & witches

  # Speed multipliers applied to arrows shot by specific entity types.
  multipliers:
    GLOBAL: 1.0 # Multiplier applied on top of entity-specific values below
    PLAYER: 1.0
    SKELETON: 1.5
    PILLAGER: 1.4
    DROWNED: 1.2
    STRAY: 1.5
    BOGGED: 1.5
    ILLUSIONER: 1.5

# =========================================================================
# 4. BETTER BOATS
# =========================================================================
better-boats:
  enabled: true

  # Spacebar jump propulsion while in water or on ground
  jump:
    enabled: true
    force: 0.35
    sound-volume: 1.0
    sound-pitch: 0.8

  # Freezes water into Frosted Ice when riding boats with Frost Walker boots
  frost-walker:
    enabled: true

  # Smooth buoyancy controller allowing boats to travel upstream/rapids
  # Uses 5-point star prediction with negative-coordinate floor calculation
  smooth:
    enabled: true
    sample-radius: 0.8
    flat-tolerance: 0.05
    target-offset: 0.1
    strength: 0.4
    damping: 0.1
    max-vertical-speed: 0.5
    minimum-change: 0.01

# =========================================================================
# 5. BETTER ELYTRAS
# =========================================================================
better-elytras:
  enabled: true

  # Speed limit while gliding (blocks per second). Vanilla flight is ~30-35.
  max-speed: 75.0

  # Visual action bar speedometer format
  speedometer-format: "<green>◀</green> <{color}>Speed: {speed} m/s</{color}> <green>▶</green>"
  speedometer-colors:
    low: "green"
    low-threshold: 40.0
    moderate: "gold"
    moderate-threshold: 60.0
    high: "red"

  # Mid-air boost using Wind Charges while gliding
  wind-charge-boost:
    enabled: true
    multiplier: 1.2
    sound: "entity.wind_charge.wind_burst"
    particle: "gust_emitter_large"

  # Ground launch sequence using Wind Charges while wearing an Elytra
  charged-jump:
    enabled: true
    vertical-force: 1.8
    horizontal-force: 0.3
    sound: "entity.generic.explode"
    secondary-sound: "entity.wind_charge.wind_burst"

  # Dropping TNT while gliding with Elytra
  bombing:
    enabled: true
    cooldown-seconds: 1.0
    fuse-ticks: 80
    require-igniter: true # Requires Flint and Steel or Fire Charge in hand
    inherit-inertia: true # TNT inherits player's flight velocity

# =========================================================================
# 6. BETTER INVISIBILITY
# =========================================================================
better-invisibility:
  enabled: true
  # Hides armor pieces from other players when under invisibility
  hide-armor: true
  # Hides held items in main hand and off-hand when under invisibility
  hide-held-items: false
  # Strips potion swirl particles when drinking invisibility potions (100% transparent)
  hide-potion-particles: true
  # Drastically reduces mob detection range while invisible
  reduce-mob-detection: true
  # Maximum distance (blocks) mobs can notice an invisible player unless attacked
  mob-detection-range: 2.5
  # If true, mobs will retaliate if the invisible player attacks them first
  allow-retaliation: true

# =========================================================================
# 7. BETTER LADDERS
# =========================================================================
better-ladders:
  enabled: true
  quick-climb: true # Right-click ladder with empty hand to warp to top/bottom
  chain-place: true # Sneak right-click with ladder to place down the column
  prevent-breaking: true # Allows ladders to stay intact without a support block behind them

# =========================================================================
# 8. CHAINMAIL SIEVE
# =========================================================================
chainmail-sieve:
  enabled: true
  durability-cost: 1 # Helmet durability deducted per broken falling block
  drop-item: true
  particles: true
  sounds: true
  supported-materials:
    - "SAND"
    - "RED_SAND"
    - "GRAVEL"
    - "SUSPICIOUS_SAND"
    - "SUSPICIOUS_GRAVEL"
    - "SNOW"

# =========================================================================
# 9. COPPER ARMOR HAZARDS
# =========================================================================
copper-armor:
  enabled: true
  # Check interval in ticks (600 ticks = 30 seconds)
  check-interval: 600
  # Probability per piece of being struck during storms (0.25 = 25% per piece)
  strike-chance-per-piece: 0.25
  # Ambient electrical spark particles around players wearing copper during storms
  ambient-sparks: true

# =========================================================================
# 10. COPPER OXIDATION WATER BOTTLES
# =========================================================================
copper-oxidation:
  enabled: true
  # Splash water bottle AOE effect radius in blocks
  splash-radius: 3.5
  # Visual particles and sound effects when blocks advance in oxidation
  effects: true

# =========================================================================
# 11. CUSTOM ARMOR DURABILITY
# =========================================================================
custom-armor-durability:
  enabled: true
  # Multiplier applied directly to raw durability damage.
  # - Set to 1.0 for vanilla durability loss.
  # - Set to 0.2 to only take 20% durability damage (armor lasts 5x longer).
  multiplier: 0.2
  # Flat integer added or subtracted after the multiplier.
  # - Negative values (e.g., -1) act as "Damage Negation" against weak hits.
  # - Positive values (e.g., 1) add extra wear-and-tear per hit.
  flat-modifier: 0

